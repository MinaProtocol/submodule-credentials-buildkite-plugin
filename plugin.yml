name: Submodule Credentials
description: Gives git a token for private GitHub URLs of one organization, for the whole job.
author: https://github.com/MinaProtocol
public: true
requirements:
  - bash
configuration:
  properties:
    org:
      type: string
      description: GitHub organization whose URLs receive the token.
    token-env:
      type: string
      description: Name of the environment variable that holds the token.
  additionalProperties: false
